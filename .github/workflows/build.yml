name: build
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Shell syntax check
        run: |
          bash -n pkgs/fusion360/fusion360.sh
      - name: Evaluate flake (no build)
        run: |
          nix flake check --no-build
          nix eval .#packages.x86_64-linux.fusion360.meta.description
  build:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Build fusion360 (compiles Wine if not cached)
        run: nix build .#fusion360 --print-build-logs
        timeout-minutes: 300
